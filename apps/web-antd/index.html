<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="Ypbin IoT 物联网平台 —— 设备接入、物模型、告警与运维的一体化控制台" />
    <meta name="keywords" content="Ypbin IoT 物联网平台 IoT Vue3 Vite" />
    <meta name="author" content="ypbin-iot" />
    <!--
      viewport 只保留「宽度跟随设备 + 初始 1:1」。
      原值还带 `minimum-scale=1.0,maximum-scale=1.0,user-scalable=0`，等于**禁止双指缩放**：
      低视力/现场强光环境下用户放不大点位地址、寄存器号这类小字，违反 WCAG 1.4.4（需允许放大到 200%）。
      注：`lang="zh"` 仍是固定值，理想做法是按 locale 动态设置，落点在 `src/bootstrap.ts`
      （不属本次改动范围），已在汇报里告诉 Lead。
    -->
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title>%VITE_APP_TITLE%</title>
    <link rel="icon" type="image/png" href="/ypbin-logo.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
