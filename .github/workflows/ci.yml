name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 校验与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ⚠️ 本仓 CI 原本没有 lint，也没有任何 i18n 校验；实测过一次「键少了 page. 前缀」导致
      # IoT 页面 95 处文案渲染成原始 key（CI 全绿也发现不了）。此步骤补上该盲区。
      - name: IoT i18n 键存在性校验
        run: node scripts/check-iot-i18n-keys.mjs

      # 🔴 **新增门禁**（本 PR 提案，理由/范围/误报风险见 PR 描述与脚本头注释）：
      # 上一步只证明「键**存在**」，证明不了「值**能不能编译**」。2026-09-27 线上「在线调试」
      # 页签内容区全白，根因就是文案里的字面 `{`/`}` 让 vue-i18n 在**渲染期**抛 SyntaxError——
      # 而键存在性校验、typecheck、构建**全绿**。本步用真实 vue-i18n 编译**全库**（zh-CN + en-US
      # 共 44 个语言包文件）的每个字符串叶子键，谁编译不过就点名谁。
      # 退出码 2 只用于「参数写错」，退出码 1 = 有文案编译不过 / 门禁空跑。
      - name: i18n 文案编译校验（全库，zh-CN + en-US）
        run: node scripts/check-i18n-message-compile.mjs

      # 🔴 **新增门禁**（本 PR 提案，理由/范围/误报风险见 PR 描述与脚本头注释）：
      # 前两步只覆盖**前端源码里 `$t('…')` 写的键**；而菜单/权限的文案来源是**后端 `sys_menu.title`**
      # ——那一列存的就是 i18n 键本身，前端对它做 `$t(title)`，缺键时不报错、直接渲染原始键。
      # 实证：本门禁落地前实测 11 个键缺失（10 个 `page.ai.*` + `page.iot.alert.rule.list`），
      # 全是权限分配界面上要显示的按钮标题，而 typecheck / 构建 / 上面两条 i18n 门禁**全绿**。
      - name: 检出 ypbin-iot（sys_menu.title 的事实源）
        uses: actions/checkout@v7
        with:
          repository: wenbin-wb/ypbin-iot
          ref: main
          path: ypbin-iot

      - name: 菜单标题 i18n 键校验（SQL sys_menu.title ↔ zh-CN/en-US）
        env:
          # 必须与上方 checkout 的 `path:` 逐字一致；脚本读不到该目录时会以退出码 1 明确报
          # 「配置/检出问题」，不会退化成「0 个键 ⇒ 全绿」的假绿。
          IOT_REPO_DIR: ${{ github.workspace }}/ypbin-iot
        run: node scripts/check-menu-i18n-keys.mjs

      - name: Typecheck（web-antd）
        run: pnpm -F @vben/web-antd run typecheck

      # 🔴 IoT 前端的**组件级运行时**用例（只跑 IoT 目录）。
      #
      # 为什么必须加这一步：2026-09-27 线上「设备详情 → 在线调试」页签**内容区全白**
      # （用户原话「是什么都没有」），根因是 i18n 文案里写了未逃逸的字面 `{` `}`
      # （`page.iot.debug.valueHint` 的 `{"a":1}`）⇒ vue-i18n 在**渲染期**编译消息时抛
      # `SyntaxError: Message compilation error` ⇒ 整个子树渲染成 `<!---->`。
      # 当时 typecheck、构建、i18n 键存在性校验**全绿**——因为键确实存在，只是编译不过。
      # 这条盲区只能用「真挂载（真实 i18n + 真实 antdv + 真实 v-access 指令）」的用例兜住。
      #
      # 作用域刻意只到 `apps/web-antd/src/views/iot`：根脚本 `pnpm test:unit` 在一台
      # TZ=UTC 的主机上有**既存**的时区断言失败（`packages/@core/base/shared/.../date.test.ts` 的
      # `getSystemTimezone()` 断言要求 `Area/Location` 形态，与本改动无关），整体接入会把 CI 染红
      # ⇒ 那是另一条线，本 PR 不顺手改（已在 PR 说明里登记）。
      #
      # `apps/web-antd/src/utils` 是本 PR 追加的：`utils/backend-number.ts` 是「后端 Long
      # 序列化成字符串」这条口径的**唯一**转换点（分页 total/page/pageSize 都过它），
      # 它的边界用例必须进 CI——否则该 helper 可以悄悄写错而无人察觉。
      # 该目录下目前只有 backend-number.test.ts 一个用例文件。
      - name: IoT 前端组件级用例（真实 vue-i18n，覆盖「整块空白」这类渲染期事故）
        run: pnpm exec vitest run --dom apps/web-antd/src/views/iot apps/web-antd/src/utils

      - name: 单元测试（埋点 SDK）
        # 该 SDK 有真实逻辑（批量、队列、URL 截断、令牌携带）且已有单测，
        # 但包内原本没有任何 scripts，`pnpm -F @vben/tracking test` 是空转（无输出却成功）；
        # 这里显式接入，避免「命令成功但其实没跑」的假绿。
        run: pnpm -F @vben/tracking test

      - name: 类型检查（埋点 SDK）
        # 与单测同理：该包此前既无 scripts、也无 typecheck 门禁，
        # 包内一处签名不兼容（测试假 router 的回调参数）一直没被 CI 发现。
        run: pnpm -F @vben/tracking run typecheck

      - name: 构建（web-antd）
        run: pnpm -F @vben/web-antd run build

      # 上传**真构建产物**：`ypbin-iot` 的部署纪律是「下载 CI artifact → 覆盖 iot-ui-dist →
      # 逐字节比对 md5」（见 `ypbin-iot/docs/DEPLOY-BACKEND.md` §2），而此前本工作流只有构建、
      # **没有任何 upload 步骤** ⇒ 那条纪律不可执行，部署只能退化为「本机再构建一次」，
      # 产物与 CI 是否一致无法证明。这里只补上传，**不新增任何失败门禁**（不影响既有的绿/红判定）。
      # `if-no-files-found: error`：宁可报红也不要一个空 artifact（否则"产物一致"会变成假绿）。
      - name: 上传构建产物（部署用）
        uses: actions/upload-artifact@v4
        with:
          name: web-antd-dist
          path: apps/web-antd/dist
          if-no-files-found: error

  tracking-events-drift:
    name: 校验埋点事件码未漂移
    runs-on: ubuntu-latest
    steps:
      # 事件目录分两层：base 在 starter 仓、project 在宿主后端仓（admin）。前端生成物是**两者合并**的结果，
      # 故两仓都要检出——只检出 starter 会退化成「纯 base」生成物，与已提交的联合生成物不一致（门禁会如实报红）。
      # ⚠ 两仓的默认分支名并不同：starter 是 `master`、admin 是 `main`（starter 从未有 main）。
      # 这里显式写 `ref:` 而不是依赖默认分支：门禁的比对基准必须一眼可见——两仓各自的分支
      # 若还没合入「base 迁出 / 宿主目录」，本门禁必然失败，而此时失败性质是**检出/配置**而非事件码漂移，
      # 生成器会以退出码 2 明确区分（见 scripts/sync-tracking-events.mjs 头部说明）。
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检出 starter（base 层事件目录事实源）
        uses: actions/checkout@v7
        with:
          repository: wenbin-wb/ypbin-starter
          ref: master
          path: ypbin-starter

      - name: 检出 admin（宿主 project 层事件目录）
        uses: actions/checkout@v7
        with:
          repository: wenbin-wb/ypbin-admin
          ref: main
          path: ypbin-admin

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0

      - name: 校验前端事件码与 base + project 合并结果一致
        env:
          # 这两个路径必须与上方 checkout 的 `path:` 逐字一致（${{ github.workspace }} 即检出根目录）。
          # 生成器据 HOST_REPO_ROOT 递归定位宿主 project 层目录；显式给了却不含该目录时
          # 以退出码 2 报「配置/检出问题」，不会误报成事件码漂移。
          STARTER_REPO_ROOT: ${{ github.workspace }}/ypbin-starter
          HOST_REPO_ROOT: ${{ github.workspace }}/ypbin-admin
        run: node scripts/sync-tracking-events.mjs --check
