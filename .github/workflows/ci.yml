name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 校验与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # Lint / stylelint / oxfmt / cspell / 结构检查：与 upstream（admin-ui）保持同一套参数与作用域。
      - name: Lint（oxlint，类型感知）
        run: pnpm exec oxlint -c oxlint.config.ts --type-aware --threads=4 apps/web-antd/src

      - name: Stylelint（web-antd 全量）
        run: pnpm exec stylelint "apps/web-antd/src/**/*.{vue,css}" --config stylelint.config.mjs

      - name: 格式检查（oxfmt）
        run: pnpm exec oxfmt --check apps/web-antd/src

      - name: 拼写检查（cspell）
        run: pnpm run check:cspell

      # 信息性结构检查：check:circular / check:dep 当前只打印告警、退出码恒为 0
      # （上游 vsh 行为），因此这里不设阻断；输出仍留在 CI 日志里便于追踪。
      - name: 循环依赖 / 未使用依赖（信息性）
        run: |
          pnpm run check:circular
          pnpm run check:dep

      # 🔴 假加密守卫：.env 里的默认值只服务本地开发；生产构建若仍用占位符/空值，
      # pinia 持久化等于混淆。这里 grep 生产环境文件，门禁拦截；运行时还有 packages/stores 的硬校验。
      - name: 生产 store 加密密钥门禁（禁止占位符/空值）
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*VITE_APP_STORE_SECURE_KEY=(please-replace-me-with-your-own-key)?[[:space:]]*$' \
            apps/web-antd/.env apps/web-antd/.env.production; then
            echo "::error::生产构建环境不能使用空值或占位符 VITE_APP_STORE_SECURE_KEY；请在部署环境注入高强度随机密钥。"
            exit 1
          fi
          echo "未发现生产 env 中的空值/占位符 store 加密密钥（实际值由部署环境注入）"

      # ⚠️ IoT 文案键必须带 page. 前缀：实测过一次「键少了 page. 前缀」导致
      # IoT 页面 95 处文案渲染成原始 key（CI 全绿也发现不了）。此步骤补上该盲区。
      - name: IoT i18n 键存在性校验
        run: node scripts/check-iot-i18n-keys.mjs

      # 🔴 键存在 ≠ 值能编译。2026-09-27 线上「在线调试」页签内容区全白，根因就是文案里的
      # 字面 `{`/`}` 让 vue-i18n 在渲染期抛 SyntaxError——而键存在性校验、typecheck、构建全绿。
      # 本步用真实 vue-i18n 编译全库（zh-CN + en-US）的每个字符串叶子键。
      - name: i18n 文案编译校验（全库，zh-CN + en-US）
        run: node scripts/check-i18n-message-compile.mjs

      # 🔴 菜单/权限文案来源是后端 sys_menu.title（存的就是 i18n 键）；缺键时不报错、直接渲染原始键。
      - name: 检出 ypbin-iot（sys_menu.title 的事实源）
        uses: actions/checkout@v7
        with:
          repository: wenbin-wb/ypbin-iot
          ref: main
          path: ypbin-iot

      - name: 菜单标题 i18n 键校验（SQL sys_menu.title ↔ zh-CN/en-US）
        env:
          IOT_REPO_DIR: ${{ github.workspace }}/ypbin-iot
        run: node scripts/check-menu-i18n-keys.mjs

      - name: Typecheck（web-antd）
        run: pnpm -F @vben/web-antd run typecheck

      # 单元测试：IoT 页面 + 两仓共用模块（system/utils/store/dashboard）+ IoT 接口客户端。
      # 根脚本 `pnpm test:unit` 在 TZ=UTC 主机上有既存的时区断言失败（与本仓业务无关），故按目录显式接入。
      - name: 前端单元测试（iot / system / utils / store / dashboard / api）
        run: pnpm exec vitest run --dom apps/web-antd/src/views/iot apps/web-antd/src/views/system apps/web-antd/src/utils apps/web-antd/src/store apps/web-antd/src/views/dashboard apps/web-antd/src/api/iot

      - name: 单元测试（埋点 SDK）
        # 该 SDK 有真实逻辑（批量、队列、URL 截断、令牌携带）且已有单测，
        # 但包内原本没有任何 scripts，`pnpm -F @vben/tracking test` 是空转（无输出却成功）；
        # 这里显式接入，避免「命令成功但其实没跑」的假绿。
        run: pnpm -F @vben/tracking test

      - name: 类型检查（埋点 SDK）
        # 与单测同理：该包此前既无 scripts、也无 typecheck 门禁，
        # 包内一处签名不兼容（测试假 router 的回调参数）一直没被 CI 发现。
        run: pnpm -F @vben/tracking run typecheck

      - name: 构建（web-antd）
        run: pnpm -F @vben/web-antd run build

      # 上传**真构建产物**：`ypbin-iot` 的部署纪律是「下载 CI artifact → 覆盖 iot-ui-dist →
      # 逐字节比对 md5」（见 `ypbin-iot/docs/DEPLOY-BACKEND.md` §2），而此前本工作流只有构建、
      # **没有任何 upload 步骤** ⇒ 那条纪律不可执行，部署只能退化为「本机再构建一次」，
      # 产物与 CI 是否一致无法证明。这里只补上传，**不新增任何失败门禁**（不影响既有的绿/红判定）。
      # `if-no-files-found: error`：宁可报红也不要一个空 artifact（否则"产物一致"会变成假绿）。
      - name: 上传构建产物（部署用）
        uses: actions/upload-artifact@v7
        with:
          name: web-antd-dist
          path: apps/web-antd/dist
          if-no-files-found: error

  tracking-events-drift:
    name: 校验埋点事件码未漂移
    runs-on: ubuntu-latest
    steps:
      # 事件目录分两层：base 在 starter 仓、project 在宿主后端仓（admin）。前端生成物是**两者合并**的结果，
      # 故两仓都要检出——只检出 starter 会退化成「纯 base」生成物，与已提交的联合生成物不一致（门禁会如实报红）。
      # ⚠ 两仓的默认分支名并不同：starter 是 `master`、admin 是 `main`（starter 从未有 main）。
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检出 starter（base 层事件目录事实源）
        uses: actions/checkout@v7
        with:
          repository: wenbin-wb/ypbin-starter
          ref: master
          path: ypbin-starter

      - name: 检出 admin（宿主 project 层事件目录）
        uses: actions/checkout@v7
        with:
          repository: wenbin-wb/ypbin-admin
          ref: main
          path: ypbin-admin

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0

      - name: 校验前端事件码与 base + project 合并结果一致
        env:
          STARTER_REPO_ROOT: ${{ github.workspace }}/ypbin-starter
          HOST_REPO_ROOT: ${{ github.workspace }}/ypbin-admin
        run: node scripts/sync-tracking-events.mjs --check
