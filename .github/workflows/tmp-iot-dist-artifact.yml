# ⚠️ 临时工作流（仅用于本轮产物交付，合并前删除）
name: TMP artifact build
on:
  push:
    branches:
      - 'feat/iot-thingmodel-read-published'
  workflow_dispatch:
jobs:
  dist:
    name: 构建并上传 web-antd 产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: IoT i18n 键存在性校验
        run: node scripts/check-iot-i18n-keys.mjs
      - name: Typecheck（web-antd）
        run: pnpm -F @vben/web-antd run typecheck
      - name: 构建（web-antd）
        run: pnpm -F @vben/web-antd run build
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: iot-ui-dist
          path: apps/web-antd/dist
          retention-days: 3
          if-no-files-found: error
